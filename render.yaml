services:
  # ============================================================================
  # 🎯 Tracker Failure Simulator - FastAPI Backend
  # ============================================================================
  - type: web
    name: tracker-simulator-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # ============================================================================
  # 🖥️ Tracker Failure Simulator - Next.js 15 Frontend
  # ============================================================================
  - type: web
    name: tracker-simulator-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: tracker-simulator-backend
          property: host
