services:
  backend:
    image: botonetics/tracker-sim-be
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    working_dir: /app

  frontend:
    image: botonetics/tracker-sim-fe
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WORKER_N_URL=${WORKER_N_URL:-http://backend:8000}
      - WORKER_V_URL=${WORKER_V_URL:-http://backend:8000}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT:-true}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    working_dir: /app

networks:
  default:
    driver: bridge